<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ndema - Track Complaint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container" style="max-width: 600px;">

    <!-- Top Navigation Bar with Back Button -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <a href="/" class="btn btn-outline-secondary">&larr; Back to Home</a>
        <h3 class="mb-0 text-primary fw-bold">Ndema</h3>
    </div>

    <div class="card shadow border-0 rounded-4 p-4 text-center" th:if="${complaint != null}">
        <span class="text-uppercase text-muted fw-bold small">Complaint Tracking Code</span>
        <h1 class="text-primary fw-bold display-6 my-2" th:text="${complaint.trackingCode}"></h1>

        <hr class="my-4">

        <div class="text-start">
            <div class="mb-3">
                <span class="fw-bold d-block text-muted">Current Status:</span>
                <span class="badge bg-success fs-6 mt-1" th:text="${complaint.status}"></span>
            </div>

            <div class="mb-3">
                <span class="fw-bold d-block text-muted">Assigned Routing Agency:</span>
                <span class="fs-5 fw-semibold text-dark" th:text="${complaint.institution != null ? complaint.institution.name + ' (' + complaint.institution.shortName + ')' : 'Auto-routing in progress...'}"></span>
            </div>

            <div class="mb-3">
                <span class="fw-bold d-block text-muted">Category & Area:</span>
                <span class="text-dark" th:text="${complaint.category + ' | ' + complaint.lga}"></span>
            </div>

            <div class="mb-3">
                <span class="fw-bold d-block text-muted">Title:</span>
                <span class="text-dark" th:text="${complaint.title}"></span>
            </div>

            <div class="mb-3">
                <span class="fw-bold d-block text-muted">Description:</span>
                <p class="bg-light p-3 rounded text-dark border mb-0" th:text="${complaint.description}"></p>
            </div>
        </div>

        <a href="/report" class="btn btn-outline-primary btn-lg mt-3 fw-semibold">Submit Another Report</a>
    </div>

    <div class="alert alert-danger shadow-sm rounded-4 p-4 text-center" th:if="${complaint == null}">
        <h4>Tracking Code Not Found</h4>
        <p>Please check your ID and try again.</p>
        <a href="/" class="btn btn-secondary mt-2">Return Home</a>
    </div>

</div>
</body>
</html>
