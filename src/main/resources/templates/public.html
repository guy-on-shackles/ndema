<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ndema - Public Transparency Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0 text-dark">Ndema Public Aid Transparency Portal</h2>
            <small class="text-muted">Real-time civic data and municipal accountability statistics</small>
        </div>
        <a th:href="@{/}" class="btn btn-outline-secondary fw-semibold">&larr; Back to Home</a>
    </div>

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-3 text-center rounded-4 bg-white">
                <span class="text-muted fw-bold">Total Aid Requests Logged</span>
                <h2 class="display-5 fw-bold text-primary my-1" th:text="${total}">0</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-3 text-center rounded-4 bg-white">
                <span class="text-muted fw-bold">Total Resolved Issues</span>
                <h2 class="display-5 fw-bold text-success my-1" th:text="${resolved}">0</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-3 text-center rounded-4 bg-white">
                <span class="text-muted fw-bold">Municipal Resolution Rate</span>
                <h2 class="display-5 fw-bold text-info my-1" th:text="${resolutionRate} + '%'">0%</h2>
            </div>
        </div>
    </div>

    <!-- Public Feed -->
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white py-3">
            <h5 class="fw-bold mb-0 text-dark">Recent Public Reports Across The Gambia</h5>
        </div>
        <div class="card-body p-0">
            <ul class="list-group list-group-flush">
                <li th:each="c : ${complaints}" class="list-group-item p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="fw-bold text-dark" th:text="${c.title}"></span>
                            <small class="text-muted d-block" th:text="${c.category + ' • ' + c.lga + ' • Reported ' + #temporals.format(c.createdAt, 'dd MMM yyyy')}"></small>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <form th:action="@{/public/confirm/{id}(id=${c.id})}" method="post" class="m-0">
                                <button type="submit" class="btn btn-sm btn-outline-primary"
                                        th:disabled="${confirmedIds.contains(c.id) or c.status.name() == 'RESOLVED'}"
                                        th:text="${confirmedIds.contains(c.id) ? '✓ Confirmed' : '👍 Me too'} + ' (' + ${c.confirmations != null ? c.confirmations : 0} + ')'"></button>
                            </form>
                            <span class="badge" th:classappend="${c.status.name() == 'RESOLVED' ? 'bg-success' : 'bg-secondary'}" th:text="${c.status}"></span>
                        </div>
                    </div>
                </li>
                <li th:if="${#lists.isEmpty(complaints)}" class="list-group-item p-4 text-center text-muted">
                    No public reports available.
                </li>
            </ul>
        </div>
    </div>

</div>
</body>
</html>
