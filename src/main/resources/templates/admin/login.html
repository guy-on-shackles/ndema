<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ndema - Admin Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center min-vh-100 py-5">
<div class="container" style="max-width: 420px;">

    <!-- Back to Home, in case someone arrived here by accident -->
    <a th:href="@{/}" class="btn btn-outline-light mb-3">&larr; Back to Home</a>

    <div class="card bg-secondary text-white shadow-lg p-4 border-0 rounded-4">
        <h2 class="text-center text-warning fw-bold mb-1">🔐 Ndema Admin</h2>
        <p class="text-center text-light small mb-4">Authorised officers only</p>

        <div th:if="${error}" class="alert alert-danger py-2 small text-center" th:text="${error}"></div>

        <form th:action="@{/admin/login}" method="post" autocomplete="off">
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Security Access Code</label>
                <input type="password" name="accessCode" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm">Sign In</button>
        </form>
    </div>
</div>
</body>
</html>
