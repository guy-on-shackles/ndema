<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ndema - Audit History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="fw-bold mb-0 text-dark">📜 Audit History</h2>
            <small class="text-muted">Every admin action, newest first. Visible to all admins.</small>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary fw-semibold">&larr; Back to Dashboard</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3 p-3 bg-white">
        <input type="text" id="auditSearch" onkeyup="filterAudit()" class="form-control form-control-lg"
               placeholder="🔍 Filter by admin name, tracking code, or action...">
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="auditTable">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">Date &amp; Time</th>
                    <th>Admin</th>
                    <th>Action</th>
                    <th class="pe-4">What happened</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${auditLogs}" class="audit-row">
                    <td class="ps-4 text-nowrap small" th:text="${#temporals.format(log.timestamp, 'dd MMM yyyy HH:mm:ss')}"></td>
                    <td class="fw-semibold" th:text="${log.adminUsername}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${log.actionType == 'URGENCY_CHANGE' ? 'bg-danger' : (log.actionType == 'STATUS_CHANGE' ? 'bg-primary' : (log.actionType == 'NOTES_CHANGE' ? 'bg-info text-dark' : (log.actionType == 'ADD_ADMIN' or log.actionType == 'REMOVE_ADMIN' ? 'bg-warning text-dark' : 'bg-secondary')))}"
                              th:text="${log.actionType}"></span>
                    </td>
                    <td class="pe-4" th:text="${log.details}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(auditLogs)}">
                    <td colspan="4" class="text-center py-5 text-muted">No activity recorded yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
    function filterAudit() {
        const q = document.getElementById('auditSearch').value.toLowerCase().trim();
        document.querySelectorAll('#auditTable tr.audit-row').forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
    }
</script>
</body>
</html>
