<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ndema - Rapid Civic Action &amp; Municipal Response</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
<div class="container text-center" style="max-width: 600px;">
    <div class="card shadow-lg p-4 border-0 rounded-4">
        <h1 class="display-4 fw-bold text-primary mb-2">Ndema</h1>
        <p class="lead text-muted mb-4">A Citizen Problem Complain Platform</p>

        <div class="d-grid gap-3">
            <a th:href="@{/report}" class="btn btn-primary btn-lg fw-semibold shadow-sm py-3">🆘 Request Aid</a>
            <a th:href="@{/public}" class="btn btn-outline-primary btn-lg fw-semibold py-3">Public Transparency Portal</a>
            <a th:href="@{/ussd-sim}" class="btn btn-dark btn-lg fw-semibold py-3">USSD Simulator (*123#)</a>
        </div>

        <form th:action="@{/track}" method="get" class="input-group mt-4">
            <input type="text" name="code" class="form-control" placeholder="Have a tracking code? e.g. GM-2026-000001" maxlength="40">
            <button type="submit" class="btn btn-outline-secondary">Track</button>
        </form>

        <hr class="my-4">

        <a th:if="${!signedIn}" th:href="@{/admin/login}" class="btn btn-warning btn-lg fw-semibold text-dark py-2 w-100">🔐 Admin Sign In</a>
        <a th:if="${signedIn}" th:href="@{/admin/dashboard}" class="btn btn-warning btn-lg fw-semibold text-dark py-2 w-100">📋 Open Admin Dashboard</a>
    </div>
</div>
</body>
</html>
