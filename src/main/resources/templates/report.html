<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ndema - Submit Incident / Request Aid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container" style="max-width: 650px;">

    <!-- Top Navigation -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <a href="/" class="btn btn-outline-secondary">&larr; Back to Home</a>
        <h3 class="mb-0 text-primary fw-bold">Ndema</h3>
    </div>

    <div class="card shadow border-0 rounded-4 p-4">
        <h4 class="mb-1 text-dark fw-bold">Submit Incident / Request Aid</h4>
        <p class="text-muted small mb-4">Tap a visual icon below or type your issue to notify municipal response teams.</p>

        <form th:action="@{/report}" th:object="${complaint}" method="post">

            <!-- Illiterate-Friendly Visual Emoji Selector -->
            <label class="form-label fw-bold">1. Tap Category Icon</label>
            <input type="hidden" th:field="*{category}" id="selectedCategory" required>
            <div class="row g-2 mb-4 text-center">
                <div class="col-4">
                    <button type="button" class="btn btn-outline-primary w-100 py-3 rounded-4 cat-btn" onclick="setCategory('FLOODING_HAZARD', this)">
                        <span class="display-5 d-block">🌊</span>
                        <small class="fw-bold">Flooding</small>
                    </button>
                </div>
                <div class="col-4">
                    <button type="button" class="btn btn-outline-warning w-100 py-3 rounded-4 cat-btn" onclick="setCategory('ELECTRICITY_STREETLIGHT', this)">
                        <span class="display-5 d-block">🔥</span>
                        <small class="fw-bold">Power / Fire</small>
                    </button>
                </div>
                <div class="col-4">
                    <button type="button" class="btn btn-outline-info w-100 py-3 rounded-4 cat-btn" onclick="setCategory('WATER_SUPPLY', this)">
                        <span class="display-5 d-block">🚰</span>
                        <small class="fw-bold">Water Pipe</small>
                    </button>
                </div>
                <div class="col-4">
                    <button type="button" class="btn btn-outline-success w-100 py-3 rounded-4 cat-btn" onclick="setCategory('WASTE_SANITATION', this)">
                        <span class="display-5 d-block">🗑️</span>
                        <small class="fw-bold">Garbage</small>
                    </button>
                </div>
                <div class="col-4">
                    <button type="button" class="btn btn-outline-danger w-100 py-3 rounded-4 cat-btn" onclick="setCategory('UNSAFE_PUBLIC_SPACE', this)">
                        <span class="display-5 d-block">🚨</span>
                        <small class="fw-bold">Danger / Gun</small>
                    </button>
                </div>
                <div class="col-4">
                    <button type="button" class="btn btn-outline-secondary w-100 py-3 rounded-4 cat-btn" onclick="setCategory('ROADS_DRAINAGE', this)">
                        <span class="display-5 d-block">🛣️</span>
                        <small class="fw-bold">Road / Pothole</small>
                    </button>
                </div>
            </div>

            <!-- Voice Note Recording Feature -->
            <div class="card p-3 bg-white border mb-3 text-center rounded-4">
                <span class="fw-bold text-dark mb-1">🎤 Record Voice Note (Illiterate-Friendly)</span>
                <small class="text-muted mb-2 d-block">Tap to state location and details by voice</small>
                <div class="d-flex justify-content-center gap-2">
                    <button type="button" id="recordBtn" class="btn btn-outline-danger fw-bold rounded-pill px-4" onclick="toggleRecording()">🎙️ Start Recording</button>
                </div>
                <small id="recordStatus" class="text-success mt-2 fw-bold d-none">Voice recording attached successfully ✓</small>
            </div>

            <!-- Dynamic & Custom LGA Input -->
            <div class="mb-3">
                <label class="form-label fw-bold">2. Select or Type City / LGA</label>
                <input class="form-control form-control-lg" list="lgaOptions" th:field="*{lga}" placeholder="Pick LGA or type new city..." required>
                <datalist id="lgaOptions">
                    <option th:each="lga : ${lgas}" th:value="${lga}" th:text="${lga}"></option>
                </datalist>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">3. Report Title</label>
                <input type="text" th:field="*{title}" class="form-control form-control-lg" placeholder="e.g. Burst water main near market" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">4. Detailed Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Describe landmark, hazards, or specific safety details..." required></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">5. Phone Number (Optional for SMS updates)</label>
                <input type="text" th:field="*{reporterPhone}" class="form-control form-control-lg" placeholder="e.g. 2207000000">
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold py-3 shadow-sm">Submit Incident Report</button>
        </form>
    </div>
</div>

<script>
    function setCategory(cat, btn) {
        document.getElementById('selectedCategory').value = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active', 'btn-dark'));
        btn.classList.add('active', 'btn-dark');
    }

    let isRecording = false;
    function toggleRecording() {
        const btn = document.getElementById('recordBtn');
        const status = document.getElementById('recordStatus');
        if (!isRecording) {
            isRecording = true;
            btn.innerText = "⏹️ Stop Recording";
            btn.classList.replace('btn-outline-danger', 'btn-danger');
        } else {
            isRecording = false;
            btn.innerText = "🎙️ Record Again";
            btn.classList.replace('btn-danger', 'btn-outline-success');
            status.classList.remove('d-none');
        }
    }
</script>
</body>
</html>
