<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ndema - USSD Simulator (*123#)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center min-vh-100 py-4">
<div class="container text-center" style="max-width: 420px;">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="/" class="btn btn-outline-light btn-sm">&larr; Back to Home</a>
        <button class="btn btn-outline-warning btn-sm" onclick="resetSession()">Reset Phone Session</button>
    </div>

    <h3 class="mb-3 text-warning fw-bold">Ndema USSD (*123#)</h3>
    <small class="text-muted d-block mb-3">Simulating non-smartphone access for feature phones</small>

    <div class="card bg-secondary text-white p-3 shadow-lg border-0 rounded-4">
        <pre id="screen" class="bg-black text-success p-3 text-start rounded-3 font-monospace mb-3" style="min-height: 180px; font-size: 1.05rem; white-space: pre-wrap;"></pre>

        <div class="input-group">
            <input type="text" id="userInput" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="Enter option..." autofocus>
            <button class="btn btn-warning fw-bold px-4" onclick="sendInput()">Send</button>
        </div>
    </div>

</div>

<script>
    let sessionText = "";

    function sendInput() {
        const val = document.getElementById('userInput').value.trim();
        if (sessionText !== "") {
            sessionText += "*" + val;
        } else {
            sessionText = val;
        }
        document.getElementById('userInput').value = "";

        fetch('/ussd', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'text=' + encodeURIComponent(sessionText)
        })
        .then(res => res.text())
        .then(data => {
            document.getElementById('screen').innerText = data;
            if (data.startsWith("END")) {
                sessionText = "";
            }
        });
    }

    function resetSession() {
        sessionText = "";
        document.getElementById('screen').innerText = "Session Reset. Sending request...";
        sendInput();
    }

    document.getElementById("userInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            sendInput();
        }
    });

    sendInput();
</script>
</body>
</html>
